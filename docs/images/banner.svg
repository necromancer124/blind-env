<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="blind-env: a .env file for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2740"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>

  <!-- icon: an eye with a slash through it -->
  <g transform="translate(170 160)">
    <rect x="-90" y="-90" width="180" height="180" rx="40" fill="url(#icon)"/>
    <path d="M -58 0 Q 0 -48 58 0 Q 0 48 -58 0 Z" fill="none" stroke="#0b1220" stroke-width="10" stroke-linejoin="round"/>
    <circle r="17" fill="#0b1220"/>
    <line x1="-52" y1="-46" x2="52" y2="46" stroke="url(#icon)" stroke-width="22" stroke-linecap="round"/>
    <line x1="-52" y1="-46" x2="52" y2="46" stroke="#0b1220" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="310" y="142" fill="#f8fafc" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="76" font-weight="700">blind-env</text>
  <text x="312" y="196" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="29">A .env file for AI agents. They use your secrets by name,</text>
  <text x="312" y="234" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="29">but never see the values.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="24">
    <rect x="312" y="256" width="560" height="42" rx="10" fill="#0b1220" stroke="#334155"/>
    <text x="330" y="285"><tspan fill="#5eead4">token</tspan><tspan fill="#cbd5e1"> = </tspan><tspan fill="#fbbf24">***GITHUB_TOKEN***</tspan></text>
  </g>
</svg>
