<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0b1220, #1b2740);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f8fafc;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 44px; }
  .name { font-size: 112px; font-weight: 700; letter-spacing: -1px; }
  .tag { font-size: 40px; color: #94a3b8; margin-top: 36px; line-height: 1.35; }
  .chip {
    margin-top: 44px; align-self: flex-start;
    font-family: Consolas, monospace; font-size: 34px;
    background: #0b1220; border: 2px solid #334155; border-radius: 14px; padding: 14px 26px;
  }
  .k { color: #5eead4; } .v { color: #fbbf24; } .e { color: #cbd5e1; }
</style>
</head>
<body>
  <div class="row">
    <svg width="200" height="200" viewBox="-100 -100 200 200">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
      <rect x="-100" y="-100" width="200" height="200" rx="44" fill="url(#g)"/>
      <g transform="rotate(12)"><rect x="-44" y="-64" width="88" height="128" rx="11" fill="#0b1220" opacity="0.35"/></g>
      <g transform="rotate(-8)">
        <rect x="-47" y="-66" width="94" height="132" rx="12" fill="#0b1220"/>
        <rect x="-37" y="-56" width="74" height="112" rx="7" fill="none" stroke="#5eead4" stroke-width="3.5"/>
        <path d="M 0 -27 L 19 0 L 0 27 L -19 0 Z" fill="#5eead4"/>
        <path d="M -37 -56 L 37 56 M 37 -56 L -37 56" stroke="#5eead4" stroke-width="1.6" opacity="0.35"/>
      </g>
    </svg>
    <div class="name">facedown</div>
  </div>
  <div class="tag">A .env file for AI agents.<br>They use your secrets by name, but never see the values.</div>
  <div class="chip"><span class="k">token</span><span class="e"> = </span><span class="v">***GITHUB_TOKEN***</span></div>
</body>
</html>
